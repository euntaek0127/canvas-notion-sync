name: Canvas to Notion Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sync Canvas assignments to Notion
        env:
          CANVAS_BASE_URL: ${{ vars.CANVAS_BASE_URL }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_AGENDA_DATA_SOURCE_ID: ${{ vars.NOTION_AGENDA_DATA_SOURCE_ID }}
          NOTION_COURSES_DATA_SOURCE_ID: ${{ vars.NOTION_COURSES_DATA_SOURCE_ID }}
        run: python sync.py
